name: CI

# PRs: checks only. Push to main, or a manual "Run workflow" on main: checks, then (only if they pass)
# a signed release APK published as a GitHub Release.
on:
  pull_request:
  push:
    branches: [main]
  # "Run workflow" button in the Actions tab: re-runs checks and, on main, publishes a release.
  workflow_dispatch:

# Actions are pinned to full commit SHAs (with the version in a comment) so a moved or compromised
# tag can never run new code with access to the signing secrets. Dependabot proposes the updates.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs are cancelled; main runs always finish so no release is skipped half-way.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The project deliberately has no Gradle wrapper; CI pins the same toolchain as local development.
  GRADLE_VERSION: "9.8.1"
  JAVA_VERSION: "25"
  ANDROID_PACKAGES: "platforms;android-36 build-tools;36.0.0"

jobs:
  checks:
    name: Lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: ${{ env.ANDROID_PACKAGES }}

      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2 (v6+ adds proprietary terms; stay on v5)
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Lint, unit tests, debug build
        run: gradle :app:lintDebug :app:testDebugUnitTest :app:assembleDebug

      - name: Upload lint report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.*

  release:
    name: Signed release
    needs: checks
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: ${{ env.ANDROID_PACKAGES }}

      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2 (v6+ adds proprietary terms; stay on v5)
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          # Release builds never write the shared cache; only the checks job populates it.
          cache-read-only: true

      - name: Restore and check signing keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          for name in RELEASE_KEYSTORE_BASE64 RELEASE_KEYSTORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Release signing secret $name is not set."
              exit 1
            fi
          done
          # Pasting into the secrets UI easily adds line breaks or spaces; they are never valid base64 content.
          if ! printf '%s' "$RELEASE_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$RUNNER_TEMP/release.jks" 2>/dev/null; then
            echo "::error::RELEASE_KEYSTORE_BASE64 is not valid base64. Re-create it from the keystore file with: base64 -w0 release.jks"
            exit 1
          fi
          # Fail here, with a clear message, rather than deep inside the Gradle build.
          if ! keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass:env RELEASE_KEYSTORE_PASSWORD -alias "$RELEASE_KEY_ALIAS" > /dev/null 2>&1; then
            echo "::error::Could not open the keystore with RELEASE_KEYSTORE_PASSWORD, or it has no key named RELEASE_KEY_ALIAS."
            exit 1
          fi

      - name: Build signed release APK
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          # Always increasing, so every release installs as an update over the previous one.
          RELEASE_VERSION_CODE: ${{ github.run_number }}
        run: gradle :app:assembleRelease

      - name: Verify signature and name the APK
        id: apk
        run: |
          tools="$ANDROID_HOME/build-tools/36.0.0"
          src=app/build/outputs/apk/release/app-release.apk
          "$tools/apksigner" verify --print-certs "$src"
          version=$("$tools/aapt2" dump badging "$src" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          tag="v${version}-${{ github.run_number }}"
          apk="rimlit-${tag}.apk"
          cp "$src" "$apk"
          sha256sum "$apk" > "$apk.sha256"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "apk=$apk" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.apk.outputs.tag }}" \
            "${{ steps.apk.outputs.apk }}" "${{ steps.apk.outputs.apk }}.sha256" \
            --target "$GITHUB_SHA" \
            --title "Rimlit ${{ steps.apk.outputs.tag }}" \
            --generate-notes

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
