name: CI

# PRs: checks only. Merge (push) to main: checks, then — only if they pass — a signed release APK
# published as a GitHub Release.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs are cancelled; main runs always finish so no release is skipped half-way.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The project deliberately has no Gradle wrapper; CI pins the same toolchain as local development.
  GRADLE_VERSION: "9.8.1"
  JAVA_VERSION: "25"
  ANDROID_PACKAGES: "platforms;android-36 build-tools;36.0.0"

jobs:
  checks:
    name: Lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: android-actions/setup-android@v3
        with:
          packages: ${{ env.ANDROID_PACKAGES }}

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Lint, unit tests, debug build
        run: gradle :app:lintDebug :app:testDebugUnitTest :app:assembleDebug

      - name: Upload lint report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.*

  release:
    name: Signed release
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: android-actions/setup-android@v3
        with:
          packages: ${{ env.ANDROID_PACKAGES }}

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          # Release builds never write the shared cache; only the checks job populates it.
          cache-read-only: true

      - name: Restore signing keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::Release signing secrets are not configured (RELEASE_KEYSTORE_BASE64 is missing)."
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          # Always increasing, so every release installs as an update over the previous one.
          RELEASE_VERSION_CODE: ${{ github.run_number }}
        run: gradle :app:assembleRelease

      - name: Verify signature and name the APK
        id: apk
        run: |
          tools="$ANDROID_HOME/build-tools/36.0.0"
          src=app/build/outputs/apk/release/app-release.apk
          "$tools/apksigner" verify --print-certs "$src"
          version=$("$tools/aapt2" dump badging "$src" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          tag="v${version}-${{ github.run_number }}"
          apk="rimlit-${tag}.apk"
          cp "$src" "$apk"
          sha256sum "$apk" > "$apk.sha256"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "apk=$apk" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.apk.outputs.tag }}" \
            "${{ steps.apk.outputs.apk }}" "${{ steps.apk.outputs.apk }}.sha256" \
            --target "$GITHUB_SHA" \
            --title "Rimlit ${{ steps.apk.outputs.tag }}" \
            --generate-notes

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
